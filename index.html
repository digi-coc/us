<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shru & Shravya ♡</title>

    <meta
        name="description"
        content="A little surprise from Shru, every day. ♡"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#fff8e8"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Shru & Shravya"
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="top-bar">

        <div class="top-bar-left">

            <div
                id="dayNumber"
                class="day-counter"
            >
                DAY 001 / 365
            </div>

            <div
                id="countdownTimer"
                class="countdown-timer"
            >
                00:00:00
            </div>

        </div>


        <div class="top-bar-actions">

            <button
                id="memoryBoxButton"
                class="icon-button"
                type="button"
                aria-label="Open Memory Box"
                title="Memory Box"
            >
                📦
            </button>


            <button
                id="musicToggle"
                class="music-toggle"
                type="button"
                aria-label="Toggle music"
                title="Music"
            >
                ♫
            </button>

        </div>

    </header>



    <!-- =====================================================
         HOME
    ====================================================== -->

    <main
        id="homeScreen"
        class="screen active"
    >

        <div class="home-content">

            <div class="panda-decoration panda-home">
                🐼
            </div>

            <h1>
                Hey, Shravya.
            </h1>

            <p class="home-message">
                I left something for you today. ♡
            </p>

            <button
                id="openSurpriseButton"
                class="primary-button"
                type="button"
            >
                🎁 OPEN TODAY'S SURPRISE
            </button>

        </div>

    </main>



    <!-- =====================================================
         SURPRISE
    ====================================================== -->

    <section
        id="surpriseScreen"
        class="screen"
    >

        <div class="surprise-page">

            <div class="surprise-heading">

                <div
                    id="surpriseDayLabel"
                    class="small-label"
                ></div>

                <h2 id="surpriseTitle">
                    A Little Surprise ♡
                </h2>

                <p id="surpriseDescription">
                </p>

            </div>


            <!-- PRESENT -->

            <div
                id="present"
                class="present-area"
            >

                <button
                    id="presentButton"
                    class="present-button"
                    type="button"
                    aria-label="Open present"
                >

                    <span class="present-box">

                        <span class="present-lid">
                        </span>

                        <span class="present-body">
                        </span>

                        <span class="present-ribbon-vertical">
                        </span>

                        <span class="present-ribbon-horizontal">
                        </span>

                        <span class="present-bow">
                            🎀
                        </span>

                    </span>

                </button>

            </div>


            <!-- SURPRISE CONTENT -->

            <div
                id="surpriseContent"
                class="surprise-content"
            >
            </div>


            <!-- COMPLETION -->

            <div
                id="completionArea"
                class="completion-area"
            >

                <button
                    id="completeSurpriseButton"
                    class="primary-button"
                    type="button"
                >
                    I FOUND IT ♡
                </button>

            </div>


            <!-- BACK HOME -->

            <button
                id="backHomeButton"
                class="text-button"
                type="button"
            >
                ← Back home
            </button>

        </div>

    </section>

    
    <!-- =====================================================
         PORTAL
    ====================================================== -->

    <section
        id="portalScreen"
        class="screen"
    >

        <div class="portal-page">

            <div
                id="portal"
                class="portal"
            >

                <div class="portal-glow">
                </div>

                <div class="portal-ring">
                </div>

                <!-- app.js expects THIS exact ID -->
                <div
                    id="memoryObjectPreview"
                    class="portal-memory-object"
                >
                </div>

            </div>


            <h2>
                A new memory found. ♡
            </h2>

            <p>
                I'm keeping this one for us.
            </p>

        </div>

    </section>



    <!-- =====================================================
         MEMORY BOX
    ====================================================== -->

    <section
        id="memoryScreen"
        class="screen"
    >

        <div class="memory-page">

            <div class="memory-heading">

                <div class="panda-decoration">
                    🐼
                </div>

                <h2>
                    Our Memory Box
                </h2>

                <p>
                    Every little thing we collect stays here. ♡
                </p>

            </div>


            <div
                id="memoryBox"
                class="memory-box"
            >

                <div
                    id="memoryBoxInside"
                    class="memory-box-inside"
                >

                    <div
                        id="emptyMemoryMessage"
                        class="empty-memory-message"
                    >

                        <span class="empty-memory-icon">
                            📦
                        </span>

                        <span>
                            It's empty right now...
                        </span>

                        <span>
                            Let's fill it together. ♡
                        </span>

                    </div>

                </div>

            </div>


            <div
                id="memoryBackArea"
                class="memory-back-area"
            >

                <button
                    id="memoryBackButton"
                    class="text-button"
                    type="button"
                >
                    ← Back
                </button>

            </div>

        </div>

    </section>



    <!-- =====================================================
         BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >

        <source
            src="assets/music/perfect-acoustic.mp3"  
            type="audio/mpeg"
        >

    </audio>



    <!-- =====================================================
         APP
    ====================================================== -->

    <script src="app.js"></script>


</body>

</html>
